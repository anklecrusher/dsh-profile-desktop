# =============================================================================
# WEB SEARCH -> DeepSeek Search & Fetch API  (2026-10-23)
# =============================================================================
# Why the shipped default was broken:
#   dsh-base points `web.searchProvider` at `deepseek-official`, which only
#   @deepseek-ai/dsh-web-search-deepseek registers. That row was disabled below,
#   so no provider answered and every web_search call failed with
#   `configured web provider "deepseek-official" is not registered`.
#
# Why this backend instead of re-enabling that row:
#   @deepseek-ai/dsh-web-search-deepseek runs the search INSIDE a full Messages
#   turn (one model call plus generated tokens per search) and needs an
#   Anthropic-compatible server-side web_search tool, which beeapi does not
#   implement -- it returns no web_search_tool_result block (probed 2026-10-23).
#   @deepseek-ai/dsh-web-deepseek-api calls the dedicated retrieval endpoints
#   instead: POST /v1/tools/search and /v1/tools/fetch, $0.75 per 1,000
#   successful requests, and no auxiliary model tokens.
#
# Independence from the chat route is deliberate and verified:
#   the Search/Fetch API lives on api.deepseek.com and authenticates with the
#   official sk- key in $DSH_HOME/.env. beeapi provides neither -- its gateway
#   answers 404 for /v1/tools/search, and beeapi keys are rejected by
#   api.deepseek.com with 401. So chat stays on beeapi while search bills
#   straight to the DeepSeek platform account. Neither side affects the other.
#
# Measured 2026-10-23 over 10 mixed zh/en queries, 10 results each:
#   DeepSeek  0.47 s/query, 7.1 unique domains, avg rerank 2.18, 76% dated
#   Tavily    4.18 s/query, 8.4 unique domains, 0% dated, Jaccard overlap 0.07
#   -> DeepSeek is ~9x faster and ~10.7x cheaper; Tavily spreads across more
#      domains. Both stay available: Tavily remains reachable through the `mcp`
#      gateway for cross-checking, this row serves the native web_search tool.
#
# Billing is per successful request, not per result, so a larger `count` is
# free; it only costs context tokens. 10 matches the shipped default.
- id: web
  config:
    searchProvider: deepseek-search-api
    fetchProvider: deepseek-fetch-api
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: false
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: https://api.deepseek.com/v1/tools
    count: 10
- id: tool-bash
  disabled: true
- id: gitbash-tool
  disabled: false

# =============================================================================
# TAVILY VIA dsh-mcp-lazy (migrated 2026-10-04)
# =============================================================================
# Tavily used to reach the model through @deepseek-ai/dsh-mcp-client (the
# @local/tavily-mcp bundle), which registers every one of its five tools as a
# real native tool. Those schemas enter EVERY request whether or not a search
# happens. Measured against the live server (tavily-mcp 4.0.4, 2026-10-04):
#
#   tavily_search    3119 B   tavily_crawl     2081 B   tavily_research   816 B
#   tavily_extract    937 B   tavily_map       1394 B
#   ---------------------------------------------------------------
#   total            8347 B  ~= 2087 tokens on every single request
#
# dsh-mcp-lazy keeps ONE fixed tool (`mcp`, ~1525 B ~= 381 tokens) in front of
# them and connects Tavily on first use, so the saving is ~1706 tokens/request.
# Tool names behind the gateway are `tavily__<name>`, e.g. tavily__tavily_search.
#
# The old row is disabled rather than deleted: the @local/tavily-mcp bundle
# still ships it, and both plugins serving the same servers is a configuration
# mistake the gateway reports on every status call.
#
# Two fields from the mcp-client row do not survive the move, by design:
#   - failOnStartupError: mcp-lazy refuses the name. A lazy server reports its
#     failure on the first call that needs it; use lifecycle: eager instead if
#     startup must fail loudly. Tavily is a remote HTTP service, so a connect is
#     cheap and lazy is the right trade.
#   - reconnect: mcp-lazy has no reconnect timer; a dropped server is restarted
#     by the next call that needs it.
# toolCallTimeoutMs IS carried over: tavily_research is a deep-research call and
# legitimately outruns the 60 s package default.
#
# The credential still comes from $DSH_HOME/.env (loaded into process.env at
# boot), so a value saved through the credentials UI would still be invisible
# here. Restart after editing .env: that snapshot is frozen at launch.
#
# RE-ADDED 2026-10-04 21:15: disabling the @local/tavily-mcp bundle in the
# dsh-market UI deletes this override. Its toggle reports "enabled row
# tavily-mcp in cordis.patch.yml", which strips the disable and leaves BOTH
# paths live — the gateway then warns that tavily is served twice and the
# token saving is lost. If that happens again, put this row back and restart.
- id: tavily-mcp
  disabled: true
- id: mcp-lazy
  name: 'dsh-mcp-lazy'
  config:
    idleTimeout: 10
    servers:
      # =========================================================================
      # OpenDesign (local design agent workspace) — 2026-10-18
      # =========================================================================
      # 22 MCP tools: projects/files, plus start_run/get_run/cancel_run, which
      # are the actual generation surface. OpenDesign spawns its OWN agent
      # (codex here) to produce decks / prototypes / video; DSH just commissions
      # the run and polls it. Nothing is generated in-process.
      #
      # WHY A WRAPPER (mcp-bridge.mjs) instead of pointing at the exe:
      #   - The packaged app is Electron-as-Node; without ELECTRON_RUN_AS_NODE=1
      #     it opens a second GUI window instead of speaking MCP on stdio.
      #   - OD_RESOURCE_ROOT must be pinned or list_skills answers []. Probed
      #     both ways on this machine: unset → {"skills":[]}, set → 169 skills.
      #   - The CLI entry path is versioned inside the install tree, so the
      #     wrapper resolves it rather than hardcoding a release path here.
      #
      # The bridge starts the daemon itself when /api/health does not answer
      # (start-daemon.mjs, detached, ~7s cold). It does NOT use OD's own
      # OD_MCP_BOOTSTRAP_COMMAND hook: that shells out to powershell.exe and
      # DSH's sandboxed child token forces ConstrainedLanguage, which breaks
      # the script — verified, the same command is FullLanguage under a normal
      # user token. Set OD_SKIP_DAEMON_AUTOSTART=1 to disable the autostart.
      #
      # lazy: OpenDesign costs ~0 tokens per request until a tool is called,
      # which matters because it exposes 22 tools worth ~2.5k tokens.
      - serverName: open-design
        transport: stdio
        # Absolute node path on purpose: the desktop app's own PATH does not
        # contain scoop's nodejs-lts directory, and a bare `node` would then
        # fail to spawn with ENOENT at the first tool call.
        command: 'C:\Users\ankle crusher\scoop\apps\nodejs-lts\current\node.exe'
        args:
          - 'E:\GitHubWorkspace\own\opensource\open-design-mcp-bridge\mcp-bridge.mjs'
        env:
          OD_INSTALL_ROOT: 'D:\OpenDesign'
          OD_DAEMON_URL: 'http://127.0.0.1:7456'
        toolCallTimeoutMs: 600000
        lifecycle: lazy
      - serverName: tavily
        transport: streamable-http
        url: https://mcp.tavily.com/mcp/
        headers:
          Authorization: !!js '`Bearer ${process.env.TAVILY_API_KEY}`'
        toolCallTimeoutMs: 180000
        # GitHub official remote extension server (OAuth-free: bearer PAT).
        # Same lazy gateway as tavily: tools appear as mcp__github__<name> on first use;
        # run `mcp({connect:"github"})` once to discover them.
        # NOTE: @modelcontextprotocol/server-github is deprecated on npm — do NOT swap to it.
      - serverName: github
        transport: streamable-http
        url: https://api.githubcopilot.com/mcp/
        headers:
          Authorization: !!js '`Bearer ${process.env.GITHUB_PERSONAL_ACCESS_TOKEN}`'
        toolCallTimeoutMs: 120000
- id: mnemon
