# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# The core bundle already mounts automatic compaction and /compact. Apply one
# policy to all routed models; maxTokens here caps the summary, not requests.
- id: compaction-basic
  name: "@deepseek-ai/dsh-compaction-basic"
  config:
    auto: true
    thresholdRatio: 0.8
    headroomTokens: 16384
    retainRatio: 0.16
    maxTokens: 16384
    modelPolicies:
      - provider: beeapi
        model: gpt-6-sol
        maxTokens: 8192
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: beeapi
    model: deepseek-v4.1-flash
    reasoningEffort: max
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: both
    process: detailed
    completion: completed
    usage: detailed
    developerTools: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
# =============================================================================
# BEEAPI ROUTE
# =============================================================================
# One route, on the OpenAI Responses surface (/v1), carrying every model.
#
# On this wire a thinking level travels as the *name* `reasoning.effort`, so
# each vendor's real vocabulary is offered verbatim and the gateway logs the
# tier it received alongside the tokens spent. The alternative — an
# anthropic-messages route — carries thinking as a token budget with only four
# slots and clamps both `xhigh` and `max` onto `high`
# (pi-ai dist/api/simple-options.js clampReasoning), which would collapse the
# top of every ladder into one tier and hide the tier name from the log.
#
# History, so this is not re-litigated the wrong way: a 422
# `cross_protocol_not_supported` was seen once here, and it was answered by
# moving DeepSeek to an anthropic-messages route. That was the wrong fix. The
# error names the *upstream* channel the gateway picked —
# "cannot be preserved by upstream protocol anthropic/messages" — and the
# gateway load-balances one model name across channels that do not all speak
# the same protocol. Re-checked live on this route: a streaming DeepSeek turn
# now returns no `input[].reasoning` item at all, so the replay the error is
# about has nothing to carry. Confirmed working multi-turn at 390K+ context,
# cache hit 99.8%.
#
# If that 422 ever returns, the fault is the gateway routing the model to an
# anthropic/messages channel, not this route: fix or pin the channel rather than
# moving the model off the Responses surface.
#
# `reasoningEfforts` maps a DSH level (the key, offered by the picker) to the
# spelling actually sent on the wire (the value). A level left out of the map is
# not merely hidden — it becomes unsupported for that model, and requesting it
# fails with UNSUPPORTED_REASONING_EFFORT. Levels a model cannot honour are
# deliberately absent rather than aliased, so no two tiers mean the same thing.
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      beeapi:
        displayName: beeapi
        apiKeyEnv: BEEAPI_API_KEY
        api: openai-responses
        baseURL: https://beeapi.dev/v1
        defaultMaxTokens: 65536
        # Retry the gateway's HTTP/2 stream drops. `classifyPiAiError`
        # (dsh-llm-pi-ai) maps "Error Code upstream_http2_stream_error:
        # Upstream HTTP/2 stream failed" onto the PI_AI_ERROR fallback rather
        # than TRANSPORT, because that text carries none of the words its
        # TRANSPORT branch tests for (network/connection/socket/fetch,
        # ECONN*, other side closed, terminated, premature close). PI_AI_ERROR
        # is absent from the default retryable set, so such a turn died with
        # no recovery attempt — observed 7 times in this machine's logs.
        #
        # Cost of adding it: PI_AI_ERROR is the fallback for *every*
        # unclassified message, so e.g. `upstream_error: Upstream access
        # forbidden, please contact administrator` (also PI_AI_ERROR, also in
        # these logs) now burns 5 retries too. The policy matches on code
        # only and cannot discriminate on message text.
        retryPolicy:
          mode: normal
          maxRetries: 5
          retryableCodes:
            - EMPTY_RESPONSE
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT
            - PI_AI_ERROR
          backoff:
            initialDelayMs: 500
            maxDelayMs: 10000
            jitterRatio: 0.1
        models:
          - id: gpt-6-sol
            name: gpt-6-sol
            # Successful responses reported over 678K tokens on this route.
            contextWindow: 700000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            maxTokens: 128000
          - id: gpt-6.1-sol
            name: gpt-6.1-sol
            contextWindow: 272000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
