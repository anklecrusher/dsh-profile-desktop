# =============================================================================
# TAVILY VIA dsh-mcp-lazy (migrated 2026-10-04)
# =============================================================================
# Tavily used to reach the model through @deepseek-ai/dsh-mcp-client (the
# @local/tavily-mcp bundle), which registers every one of its five tools as a
# real native tool. Those schemas enter EVERY request whether or not a search
# happens. Measured against the live server (tavily-mcp 4.0.4, 2026-10-04):
#
#   tavily_search    3119 B   tavily_crawl     2081 B   tavily_research   816 B
#   tavily_extract    937 B   tavily_map       1394 B
#   ---------------------------------------------------------------
#   total            8347 B  ~= 2087 tokens on every single request
#
# dsh-mcp-lazy keeps ONE fixed tool (`mcp`, ~1525 B ~= 381 tokens) in front of
# them and connects Tavily on first use, so the saving is ~1706 tokens/request.
# Tool names behind the gateway are `tavily__<name>`, e.g. tavily__tavily_search.
#
# The old row is disabled rather than deleted: the @local/tavily-mcp bundle
# still ships it, and both plugins serving the same servers is a configuration
# mistake the gateway reports on every status call.
#
# Two fields from the mcp-client row do not survive the move, by design:
#   - failOnStartupError: mcp-lazy refuses the name. A lazy server reports its
#     failure on the first call that needs it; use lifecycle: eager instead if
#     startup must fail loudly. Tavily is a remote HTTP service, so a connect is
#     cheap and lazy is the right trade.
#   - reconnect: mcp-lazy has no reconnect timer; a dropped server is restarted
#     by the next call that needs it.
# toolCallTimeoutMs IS carried over: tavily_research is a deep-research call and
# legitimately outruns the 60 s package default.
#
# The credential still comes from $DSH_HOME/.env (loaded into process.env at
# boot), so a value saved through the credentials UI would still be invisible
# here. Restart after editing .env: that snapshot is frozen at launch.
#
# RE-ADDED 2026-10-04 21:15: disabling the @local/tavily-mcp bundle in the
# dsh-market UI deletes this override. Its toggle reports "enabled row
# tavily-mcp in cordis.patch.yml", which strips the disable and leaves BOTH
# paths live — the gateway then warns that tavily is served twice and the
# token saving is lost. If that happens again, put this row back and restart.
- id: tavily-mcp
  disabled: true
- id: mcp-lazy
  name: 'dsh-mcp-lazy'
  config:
    idleTimeout: 10
    servers:
      - serverName: tavily
        transport: streamable-http
        url: https://mcp.tavily.com/mcp/
        headers:
          Authorization: !!js '`Bearer ${process.env.TAVILY_API_KEY}`'
        toolCallTimeoutMs: 180000
- id: mnemon
  name: dsh-mnemon
  config:
    remoteAccess: read-only
    storageScope: custom
    dataDir: D:\Users\ankle crusher\Documents\.mnemon
    timeoutMs: 10000
    defaultRecallLimit: 10
    embedding:
      enabled: false
      endpoint: http://localhost:11434
      model: nomic-embed-text
    memoryView:
      strategyTypeId: default-three-tier
      entries:
        include:mnemon-strategy-auto-capture:
          config: {}
        include:mnemon-strategy-light-context:
          config: {}
        include:mnemon-strategy-scoped:
          config: {}
    recallQuality:
      policy: strict-v1
      lowScoreThreshold: 0.25
      highScoreThreshold: 0.6
      candidateMultiplier: 3
      maxMediumResults: 4
      maxUnknownResults: 2
    routingGuidance: true
    tabEnabled: true
    writeEnabled: true
    lifecycleEnabled: true
    recallMode: guided
    writebackMode: guided
    idleReviewMs: 30000
- id: better-sidebar
  name: dsh-better-sidebar
  config:
    agentOpenTools: true
- id: mnemon-strategy-auto-capture
  disabled: false
- id: mnemon-strategy-light-context
  disabled: false
- id: mnemon-strategy-scoped
  disabled: false
- id: image-gen
  name: dsh-image-gen
  config:
    provider: google-sub
    openaiCompatBaseURL: https://beeapi.dev/v1
    openaiCompatModel: gpt-image-2.5
